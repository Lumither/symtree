[package]
name = "symtree"
version = "0.1.0"
edition = "2024"

[features]
default = []
debug_perf = []

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
